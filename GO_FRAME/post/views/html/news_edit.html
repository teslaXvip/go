<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑新闻 - News</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a class="brand" href="/news">News</a>
      <div class="nav-links">
        <a href="/news">首页</a>
        <a href="/news/issue">发布新闻</a>
        <a href="/modify_pass">修改密码</a>
        <a href="/logout">退出登录</a>
      </div>
    </nav>
  </header>

  <main class="container page">
    <div class="auth-wrap">
      <div class="card">
        <h1 class="card-title">编辑新闻</h1>
        <p class="card-desc">修改后将立即生效</p>
        <form id="editForm" autocomplete="off">
          <input type="hidden" id="id" value="{{.Id}}">
          <div class="field">
            <label for="title">标题</label>
            <input class="input" type="text" id="title" value="{{.Title}}" maxlength="100" required>
          </div>
          <div class="field">
            <label for="content">正文</label>
            <textarea class="input" id="content" required>{{.Content}}</textarea>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit" id="submitBtn">保 存</button>
            <a class="btn btn-secondary" href="/news/{{.Id}}">取 消</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    (function () {
      var form = document.getElementById('editForm');
      var btn = document.getElementById('submitBtn');
      var id = document.getElementById('id').value;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var title = document.getElementById('title').value.trim();
        var content = document.getElementById('content').value.trim();
        if (!title) { showToast('请输入标题', 'error'); return; }
        if (!content) { showToast('请输入正文', 'error'); return; }

        var body = new URLSearchParams();
        body.append('id', id);
        body.append('title', title);
        body.append('content', content);

        btn.disabled = true;
        fetch('/news/update', {
          method: 'POST',
          body: body,
          credentials: 'same-origin'
        }).then(function (r) {
          return r.text().then(function (t) { return { ok: r.ok, text: t }; });
        }).then(function (res) {
          if (res.ok) {
            showToast('保存成功');
            setTimeout(function () { location.href = '/news/' + id; }, 500);
          } else {
            btn.disabled = false;
            showToast(res.text || '保存失败', 'error');
          }
        }).catch(function () {
          btn.disabled = false;
          showToast('网络异常，请稍后重试', 'error');
        });
      });
    })();
  </script>
</body>
</html>
