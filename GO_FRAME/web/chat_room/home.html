<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>WebSocket聊天室</title>
    <style>
      #msgBox {
        width: 600px;
        height: 400px;
        border: 1px solid #ccc;
        overflow-y: auto;
        padding: 10px;
        margin-bottom: 10px;
      }
      .item {
        margin: 4px 0;
      }
      .tip {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="msgBox"></div>
    <input type="text" id="nameInput" placeholder="输入你的昵称" />
    <button onclick="connect()">连接聊天室</button>
    <br /><br />
    <input
      type="text"
      id="msgInput"
      placeholder="输入消息"
      style="width: 500px"
    />
    <button onclick="sendMsg()">发送</button>

    <script>
      let ws = null
      const msgBox = document.getElementById('msgBox')
      const msgInput = document.getElementById('msgInput')
      const nameInput = document.getElementById('nameInput')

      function append(text, isTip = false) {
        const div = document.createElement('div')
        div.className = isTip ? 'item tip' : 'item'
        div.innerText = text
        msgBox.appendChild(div)
        msgBox.scrollTop = msgBox.scrollHeight
      }

      function connect() {
        const name = nameInput.value.trim()
        if (!name) {
          alert('请先输入昵称')
          return
        }
        if (ws && ws.readyState === WebSocket.OPEN) {
          append('已经连接了！', true)
          return
        }
        // 和后端地址对应，后端是 /chat
        ws = new WebSocket(`ws://127.0.0.1:5657/chat`)

        ws.onopen = () => {
          append('✅ 连接成功，正在上报昵称...', true)
          // 第一条消息发给后端作为用户名（和go代码约定一致）
          ws.send(name)
        }

        ws.onmessage = (evt) => {
          append(evt.data)
        }

        ws.onclose = () => {
          append('❌ 连接断开', true)
          ws = null
        }

        ws.onerror = (err) => {
          append('⚠️ 连接出错', true)
          console.error(err)
        }
      }

      function sendMsg() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          alert('请先连接聊天室')
          return
        }
        const text = msgInput.value.trim()
        if (!text) return
        ws.send(text)
        msgInput.value = ''
      }

      // 回车发送
      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMsg()
      })
    </script>
  </body>
</html>
